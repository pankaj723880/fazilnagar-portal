<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18232E"/>
      <stop offset="100%" stop-color="#0f171e"/>
    </linearGradient>
    <linearGradient id="accentGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8323C"/>
      <stop offset="100%" stop-color="#8a1f27"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <!-- Border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Subtle emblem circle -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#accentGrad512)" stroke-width="8" stroke-dasharray="14 10" opacity="0.6"/>

  <!-- Center Letter F badge -->
  <rect x="166" y="154" width="180" height="204" rx="36" fill="url(#accentGrad512)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.45))"/>
  
  <text x="256" y="300" font-family="Inter, -apple-system, sans-serif" font-weight="900" font-size="142" fill="#ffffff" text-anchor="middle">F</text>
  
  <!-- Subtitle -->
  <text x="256" y="405" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#94a3b8" letter-spacing="4" text-anchor="middle">FAZILNAGAR</text>
  
  <!-- Bottom micro status dot -->
  <circle cx="256" cy="432" r="6" fill="#168568"/>
</svg>
