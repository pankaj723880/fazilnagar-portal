    <!-- Homepage Splash Launcher Gate: runs before any DOM paint to prevent flash or stuck overlay on nested routes -->
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          if (p === '/' || p === '/index.html' || p === '/town' || p === '/portal' || p === '/fazilnagar') {
            document.documentElement.classList.add('is-homepage-launch');
          }
          if (!p.startsWith('/admin')) {
            var rawTheme = localStorage.getItem('fazilnagar_global_theme');
            var themeId = 'heritage-terracotta';
            var mode = 'light';
            if (rawTheme) {
              try {
                var parsed = JSON.parse(rawTheme);
                if (parsed && parsed.themeId) themeId = parsed.themeId;
                if (parsed && (parsed.mode === 'dark' || parsed.mode === 'light')) mode = parsed.mode;
              } catch (_) {}
            } else {
              var legacyTheme = localStorage.getItem('fazilnagar_theme');
              if (legacyTheme === 'dark') mode = 'dark';
            }
            document.documentElement.setAttribute('data-theme-id', themeId);
            document.documentElement.setAttribute('data-public-theme', mode);
            if (mode === 'dark') {
              document.documentElement.classList.add('dark', 'theme-dark');
              document.documentElement.classList.remove('theme-light');
            } else {
              document.documentElement.classList.add('theme-light');
              document.documentElement.classList.remove('dark', 'theme-dark');
            }
          }
        } catch (_) {}
      })();
    </script>
