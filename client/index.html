    <!-- Startup Performance Instrumentation & Single Coordinated Launch Controller -->
    <script>
      window.__STARTUP_METRICS__ = {

      (function() {

          if (dismissed) return;
          var splash = document.getElementById('initial-splash-shell');
          if (!splash) return;

          dismissed = true;
          if (window.__STARTUP_METRICS__) {
            window.__STARTUP_METRICS__.homepageUsable = performance.now();
            try { performance.mark('app-homepage-usable'); } catch (e) {}
          }
          // Coordinate dismissal: double rAF ensures React DOM is painted underneath with zero flicker
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              splash.style.transition = 'opacity 180ms cubic-bezier(0.4, 0, 0.2, 1)';
              splash.style.opacity = '0';
              splash.style.pointerEvents = 'none';
              setTimeout(function() {
                try { splash.remove(); } catch (e) {}
              }, 200);
            });
          });
        };

        // Safety fallback: auto-dismiss if background JS takes unexpectedly long
        setTimeout(function() {
          if (!dismissed && typeof window.__dismissSplash === 'function') {
            window.__dismissSplash();
          }
        }, 1200);
      })();
